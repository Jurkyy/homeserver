  # ===========================================================================
  # VIEW 5: PLANT CARE
  # ===========================================================================
  # Watering schedules, environment sensors, tips, and growth tracking.
  # ===========================================================================
  - title: "Plants"
    path: "plants"
    icon: "mdi:flower"
    theme: "Jungle"
    badges: []
    cards:

      # -----------------------------------------------------------------------
      # Plant Watering Schedule
      # -----------------------------------------------------------------------
      # A markdown card with the weekly watering and care schedule.
      # Edit the content below to match your actual plant collection.
      # -----------------------------------------------------------------------
      - type: "vertical-stack"
        cards:
          - type: "custom:mushroom-title-card"
            title: "Watering Schedule"
            subtitle: "Keep the jungle alive"

          - type: "markdown"
            card_mod:
              style: |
                ha-card {
                  background-color: #1a2b14 !important;
                  border: 1px solid #2a3a24 !important;
                  border-radius: 12px !important;
                }
            content: >
              ## Weekly Plant Care Schedule


              | Day | Plants | Task |

              |-----|--------|------|

              | **Monday** | Monstera, Pothos | Water thoroughly |

              | **Tuesday** | Ferns, Calathea | Mist leaves, check soil |

              | **Wednesday** | Succulents, Snake Plant | Light watering (if dry) |

              | **Thursday** | Monstera, Pothos | Mist leaves |

              | **Friday** | All plants | Check for pests, wipe leaves |

              | **Saturday** | Herbs (Basil, Mint) | Water + harvest |

              | **Sunday** | All plants | Rotate pots for even light |


              ---


              **Fertilizing**: First Saturday of each month, dilute to half strength.

              **Repotting**: Check root-bound plants every 3 months.

      # -----------------------------------------------------------------------
      # Humidity & Temperature Sensors
      # -----------------------------------------------------------------------
      # Gauge cards for environment monitoring.
      # Replace entity IDs with your actual sensor entities.
      # -----------------------------------------------------------------------
      - type: "vertical-stack"
        cards:
          - type: "custom:mushroom-title-card"
            title: "Environment"
            subtitle: "Humidity and temperature readings"

          - type: "grid"
            columns: 2
            square: false
            cards:
              # Living room humidity
              - type: "gauge"
                entity: "sensor.living_room_humidity"
                name: "Living Room Humidity"
                unit: "%"
                min: 0
                max: 100
                needle: true
                severity:
                  green: 40
                  yellow: 60
                  red: 80
                card_mod:
                  style: |
                    ha-card {
                      background-color: #1a2b14 !important;
                      border: 1px solid #2a3a24 !important;
                      border-radius: 12px !important;
                    }

              # Living room temperature
              - type: "gauge"
                entity: "sensor.living_room_temperature"
                name: "Living Room Temp"
                unit: "°C"
                min: 10
                max: 40
                needle: true
                severity:
                  green: 18
                  yellow: 26
                  red: 32
                card_mod:
                  style: |
                    ha-card {
                      background-color: #1a2b14 !important;
                      border: 1px solid #2a3a24 !important;
                      border-radius: 12px !important;
                    }

              # Bedroom humidity
              - type: "gauge"
                entity: "sensor.bedroom_humidity"
                name: "Bedroom Humidity"
                unit: "%"
                min: 0
                max: 100
                needle: true
                severity:
                  green: 40
                  yellow: 60
                  red: 80
                card_mod:
                  style: |
                    ha-card {
                      background-color: #1a2b14 !important;
                      border: 1px solid #2a3a24 !important;
                      border-radius: 12px !important;
                    }

              # Bedroom temperature
              - type: "gauge"
                entity: "sensor.bedroom_temperature"
                name: "Bedroom Temp"
                unit: "°C"
                min: 10
                max: 40
                needle: true
                severity:
                  green: 18
                  yellow: 26
                  red: 32
                card_mod:
                  style: |
                    ha-card {
                      background-color: #1a2b14 !important;
                      border: 1px solid #2a3a24 !important;
                      border-radius: 12px !important;
                    }

      # -----------------------------------------------------------------------
      # Plant Care Tips
      # -----------------------------------------------------------------------
      # Rotating tips using a markdown card with template.
      # The template cycles through tips based on the day of the year.
      # -----------------------------------------------------------------------
      - type: "vertical-stack"
        cards:
          - type: "custom:mushroom-title-card"
            title: "Plant Tips"
            subtitle: "Daily wisdom from the jungle"

          - type: "markdown"
            card_mod:
              style: |
                ha-card {
                  background: linear-gradient(135deg, #2d5016 0%, #1a2b14 100%) !important;
                  border: 1px solid #4a7c2e !important;
                  border-radius: 12px !important;
                }
            content: >
              {% set tips = [
                "**Tip #1**: Yellowing lower leaves on your Monstera? That is usually overwatering. Let the top 2 inches of soil dry out before watering again.",
                "**Tip #2**: Group humidity-loving plants together. They create a microclimate that benefits all of them.",
                "**Tip #3**: Use room-temperature water when watering. Cold water can shock tropical roots.",
                "**Tip #4**: Brown leaf tips usually mean low humidity. Try misting or placing a tray of pebbles and water nearby.",
                "**Tip #5**: Rotate your plants a quarter turn each week so they grow evenly toward the light.",
                "**Tip #6**: Wipe dust off leaves monthly. Dusty leaves cannot photosynthesize efficiently.",
                "**Tip #7**: When repotting, choose a pot only 1-2 inches larger than the current one. Too much space holds excess moisture.",
                "**Tip #8**: Spider mites love dry conditions. Keep humidity up and inspect leaf undersides regularly.",
                "**Tip #9**: Ferns prefer indirect light and consistent moisture. Never let them fully dry out.",
                "**Tip #10**: Propagate Pothos in water - just snip below a node and wait 2-3 weeks for roots.",
                "**Tip #11**: Snake plants are nearly indestructible. Water once every 2-3 weeks and they will thrive.",
                "**Tip #12**: Calatheas fold their leaves at night (they pray!). If they stop moving, check your watering routine.",
                "**Tip #13**: Coffee grounds make great occasional fertilizer for acid-loving plants.",
                "**Tip #14**: Neem oil is a natural pest deterrent. Mix a few drops with water and spray monthly."
              ] %}
              {{ tips[now().timetuple().tm_yday % tips | length] }}

      # -----------------------------------------------------------------------
      # Plant Growth Photo Grid (Placeholder)
      # -----------------------------------------------------------------------
      # Use the picture-elements card or a custom gallery card here.
      # Replace placeholder images with your actual plant growth photos.
      # -----------------------------------------------------------------------
      - type: "vertical-stack"
        cards:
          - type: "custom:mushroom-title-card"
            title: "Growth Tracker"
            subtitle: "Visual record of your jungle"

          - type: "markdown"
            card_mod:
              style: |
                ha-card {
                  background-color: #1a2b14 !important;
                  border: 1px solid #2a3a24 !important;
                  border-radius: 12px !important;
                }
            content: >
              ### Plant Growth Photos


              To set up the growth tracker:

              1. Create a folder at `/config/www/plant-photos/`

              2. Take periodic photos of your plants

              3. Name them with date format: `monstera-2026-03-26.jpg`

              4. Replace this card with a `picture-glance` or `picture-elements` card


              ---


              **Suggested tracking plants:**

              - Monstera Deliciosa (monthly new leaf tracking)

              - Pothos vine (length measurement)

              - Fiddle Leaf Fig (height tracking)

              - Herb garden (harvest log)


              > Use the Home Assistant Companion app camera to snap quick photos
              > and save them directly to the plant photos folder.

          # Placeholder image grid - replace with actual picture cards when ready
          - type: "grid"
            columns: 3
            square: true
            cards:
              - type: "custom:button-card"
                name: "Monstera"
                icon: "mdi:leaf"
                styles:
                  card:
                    - background-color: "#1a2b14"
                    - border: "2px dashed #3a4a34"
                    - border-radius: "12px"
                    - padding: "16px"
                  icon:
