# Mopidy configuration for the homeserver stack.
# Docs: https://docs.mopidy.com/en/latest/config/

[core]
cache_dir = /var/lib/mopidy/.cache
config_dir = /etc/mopidy
data_dir = /var/lib/mopidy
max_tracklist_length = 10000
restore_state = true

[logging]
verbosity = 0

[audio]
# ALSA output — routed to the Focusrite Scarlett 2i2 (USB → 1/4" TRS →
# speakers). The Scarlett enumerates as a class-compliant USB audio card,
# so no driver work needed; we just have to point Mopidy at it instead of
# the onboard HDA codec. `plughw:` (not `hw:`) lets ALSA resample on the
# fly — Spotify/YouTube tracks arrive at mixed sample rates and the
# Scarlett locks to one at a time.
#
# Override $MOPIDY_ALSA_DEVICE in .env if your card enumerates differently
# (find it on the host with: aplay -l).
output = alsasink device=$MOPIDY_ALSA_DEVICE

[m3u]
playlists_dir = /var/lib/mopidy/playlists

[file]
enabled = false

[local]
enabled = true
media_dir = /var/lib/mopidy/media
scan_follow_symlinks = true
scan_flush_threshold = 100

[http]
enabled = true
hostname = 0.0.0.0
port = 6680
# default_app = iris is the Iris web UI mounted at /iris/, but it also
# becomes reachable at the root when it is the only webclient.
default_app = iris

[iris]
country = US
locale = en_US

[spotify]
# Requires Spotify Premium. Credentials come from .env at compose time.
# Username/password use librespot; client_id/secret are for the Web API
# (playlists, search). See:
# https://mopidy.com/ext/spotify/
enabled = true
username = $SPOTIFY_USERNAME
password = $SPOTIFY_PASSWORD
client_id = $SPOTIFY_CLIENT_ID
client_secret = $SPOTIFY_CLIENT_SECRET
bitrate = 320

[youtube]
enabled = true
allow_cache = true
youtube_api_key =
api_enabled = false
search_results = 15
playlist_max_videos = 60
musicapi_enabled = true
musicapi_cookie =
musicapi_cookiefile =
autoplay_enabled = false
