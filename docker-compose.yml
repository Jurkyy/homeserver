version: "3.8"

services:
  openclaw:
    image: ghcr.io/openclaw/openclaw:latest
    container_name: openclaw
    ports:
      - "18789:18789"
    volumes:
      - ./services/openclaw/config:/config
      - ./services/openclaw/workspace:/workspace
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - DISCORD_BOT_TOKEN=${DISCORD_BOT_TOKEN}
      - DISCORD_CLIENT_ID=${DISCORD_CLIENT_ID}
      - HA_URL=${HA_URL:-http://homeassistant:8123}
      - HA_LONG_LIVED_TOKEN=${HA_LONG_LIVED_TOKEN}
    depends_on:
      - homeassistant
    restart: unless-stopped

  mosquitto:
    image: eclipse-mosquitto:2
    container_name: mosquitto
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./services/mosquitto/config:/mosquitto/config
      - ./services/mosquitto/data:/mosquitto/data
      - ./services/mosquitto/log:/mosquitto/log
    restart: unless-stopped

  homeassistant:
    image: ghcr.io/home-assistant/home-assistant:stable
    container_name: homeassistant
    ports:
      - "8123:8123"
    volumes:
      - ./services/homeassistant/config:/config
      - /etc/localtime:/etc/localtime:ro
    depends_on:
      - mosquitto
    privileged: true
    restart: unless-stopped

  navidrome:
    image: deluan/navidrome:latest
    container_name: navidrome
    ports:
      - "4533:4533"
    volumes:
      - ./services/navidrome/data:/data
      - ${MEDIA_PATH:-/mnt/storage/media}/music:/music:ro
    environment:
      - ND_SCANSCHEDULE=1h
      - ND_LOGLEVEL=info
      - ND_SESSIONTIMEOUT=24h
      - ND_BASEURL=
    restart: unless-stopped

  jellyfin:
    image: jellyfin/jellyfin:latest
    container_name: jellyfin
    ports:
      - "8096:8096"
      - "8920:8920"
    volumes:
      - ./services/jellyfin/config:/config
      - ./services/jellyfin/cache:/cache
      - ${MEDIA_PATH:-/mnt/storage/media}:/media:ro
    environment:
      - JELLYFIN_PublishedServerUrl=${JELLYFIN_URL:-http://localhost:8096}
    restart: unless-stopped

  librespot:
    # Spotify Connect target. The user controls playback from any
    # Spotify app on the LAN — the container shows up in the device
    # picker (named via LIBRESPOT_NAME) and streams audio out the
    # Focusrite Scarlett 2i2 over ALSA.
    #
    # network_mode: host is load-bearing: Spotify Connect device
    # discovery uses mDNS zeroconf, and multicast packets don't
    # traverse the default Docker bridge cleanly. Sharing the host
    # netns puts the announcements straight on the LAN.
    #
    # Gotcha: the host `audio` GID differs between distros (Debian 13
    # = 29, Arch = 996). Set LIBRESPOT_AUDIO_GID in .env to whatever
    #   getent group audio | cut -d: -f3
    # reports on the host — group_add injects that GID supplementarily
    # so the in-container process can open /dev/snd.
    #
    # Entrypoint (services/librespot/entrypoint.sh) runs a 4-minute
    # outbound TCP keepalive to apresolve.spotify.com so librespot's
    # first user-triggered connect after long idle isn't a cold start
    # (see entrypoint.sh for the failure mode it works around).
    #
    # dns: pins the container's resolvers to NordVPN's. Docker
    # snapshots /etc/resolv.conf at container-create time; if that
    # happens before NordVPN finishes swapping the host resolver,
    # the container is left pointing at the LAN router (192.168.0.1)
    # which the killswitch then blocks for UDP 53. Symptom: librespot
    # cannot resolve Spotify endpoints, spirc init fails on first
    # connect after a reboot, "stuck on Connecting…" in the app.
    build:
      context: ./services/librespot
    container_name: librespot
    network_mode: host
    devices:
      - /dev/snd:/dev/snd
    group_add:
      - "${LIBRESPOT_AUDIO_GID:-29}"
    # avahi-daemon on the host owns UDP 5353 and the dns_sd registrar.
    # Bind-mount its sockets so libavahi-client inside the container
    # can publish _spotify-connect._tcp through the host daemon
    # instead of trying to bind 5353 itself. avahi-daemon advertises
    # the box as homeserver.local on the LAN at the same time, which
    # is how http://homeserver.local/ resolves for LAN clients.
    volumes:
      - /run/dbus/system_bus_socket:/run/dbus/system_bus_socket
      - /run/avahi-daemon/socket:/run/avahi-daemon/socket
    dns:
      - 103.86.96.100
      - 103.86.99.100
    # --zeroconf-port pins the inbound port libmdns announces. Without
    # it the port is fresh-ephemeral on every restart, and a Spotify
    # app that cached the previous announcement keeps trying the dead
    # old port — the "Homeserver shows up but tapping it hangs on
    # Connecting" symptom that survives reboots. Fixed port = stable
    # cache.
    command: >
      --name ${LIBRESPOT_NAME:-Homeserver}
      --backend alsa
      --device ${LIBRESPOT_ALSA_DEVICE:-plughw:CARD=USB,DEV=0}
      --zeroconf-interface ${LIBRESPOT_LAN_IP:-192.168.0.22}
      --zeroconf-port ${LIBRESPOT_ZEROCONF_PORT:-36421}
      --bitrate 320
      --initial-volume 80
      --enable-volume-normalisation
    restart: unless-stopped

  caddy:
    # Reverse proxy fronting the home server on :80. The catch-all
    # proxies everything to mediacast so `http://homeserver/` (the
    # Tailscale hostname) lands on the cast UI. Plain HTTP only —
    # Tailscale-MagicDNS / LAN names can't get Let's Encrypt certs.
    image: caddy:2-alpine
    container_name: caddy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./services/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./services/caddy/data:/data
      - ./services/caddy/config:/config
    restart: unless-stopped

  mediacast:
    # Phone-facing endpoint for "open this URL on the projector". The
    # user shares a URL from Android Firefox → HTTP Shortcuts app
    # POSTs it here with a bearer token. We forward to the host-side
    # helper (mediacast-host.py, systemd --user unit) at port 8766,
    # which owns the X11/Firefox side — running that from inside a
    # container needs xauth + fonts + GL + audio passthrough and isn't
    # worth the complexity for one tiny script.
    #
    # extra_hosts maps host.docker.internal to the docker bridge
    # gateway (the host's IP on this compose network), so the
    # container can reach the host helper without hardcoding the
    # bridge subnet. The host helper binds 0.0.0.0; the token is the
    # trust boundary (see services/mediacast-host/mediacast-host.py).
    build:
      context: ./services/mediacast
    container_name: mediacast
    ports:
      - "8765:8765"
    # YouTube "Subscriptions" grid reads its channel list from this
    # read-only mount (services/mediacast/config/yt-channels.txt). The
    # file is bind-mounted, not baked into the image, so editing the
    # list takes effect on the next feed refresh without a rebuild. The
    # whole section hides itself if the file is missing/empty.
    volumes:
      - ./services/mediacast/config:/config:ro
    environment:
      - MEDIACAST_TOKEN=${MEDIACAST_TOKEN}
      - MEDIACAST_HOST_URL=http://host.docker.internal:8766/open
      # mrpflix (Jellyfin) catalog in the cast UI — optional. A blank
      # MRPFLIX_URL hides the section. See .env.example.
      - MRPFLIX_URL=${MRPFLIX_URL:-}
      - MRPFLIX_USER=${MRPFLIX_USER:-}
      - MRPFLIX_PASS=${MRPFLIX_PASS:-}
    # Pin a public resolver. When NordVPN is connected on the host it
    # rewrites the host's DNS and blocks Docker's embedded resolver from
    # forwarding to the LAN router (192.168.0.1) — so container name
    # lookups (e.g. jf.mrplink.com for the mrpflix catalog) fail with
    # EAI_AGAIN even though egress through the tunnel works. Cloudflare
    # is reachable through the tunnel and survives VPN reconnects, unlike
    # the nordvpn allowlist which resets.
    dns:
      - 1.1.1.1
      - 1.0.0.1
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  tailscale:
    image: tailscale/tailscale:latest
    container_name: tailscale
    hostname: homeserver
    volumes:
      - /dev/net/tun:/dev/net/tun
      - tailscale-state:/var/lib/tailscale
    environment:
      - TS_AUTHKEY=${TAILSCALE_AUTHKEY}
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_EXTRA_ARGS=--advertise-exit-node
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    restart: unless-stopped

volumes:
  tailscale-state:
