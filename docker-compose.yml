version: "3.8"

services:
  openclaw:
    image: ghcr.io/openclaw/openclaw:latest
    container_name: openclaw
    ports:
      - "18789:18789"
    volumes:
      - ./services/openclaw/config:/config
      - ./services/openclaw/workspace:/workspace
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - DISCORD_BOT_TOKEN=${DISCORD_BOT_TOKEN}
      - DISCORD_CLIENT_ID=${DISCORD_CLIENT_ID}
      - HA_URL=${HA_URL:-http://homeassistant:8123}
      - HA_LONG_LIVED_TOKEN=${HA_LONG_LIVED_TOKEN}
    depends_on:
      - homeassistant
    restart: unless-stopped

  mosquitto:
    image: eclipse-mosquitto:2
    container_name: mosquitto
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./services/mosquitto/config:/mosquitto/config
      - ./services/mosquitto/data:/mosquitto/data
      - ./services/mosquitto/log:/mosquitto/log
    restart: unless-stopped

  homeassistant:
    image: ghcr.io/home-assistant/home-assistant:stable
    container_name: homeassistant
    ports:
      - "8123:8123"
    volumes:
      - ./services/homeassistant/config:/config
      - /etc/localtime:/etc/localtime:ro
    depends_on:
      - mosquitto
    privileged: true
    restart: unless-stopped

  navidrome:
    image: deluan/navidrome:latest
    container_name: navidrome
    ports:
      - "4533:4533"
    volumes:
      - ./services/navidrome/data:/data
      - ${MEDIA_PATH:-/mnt/storage/media}/music:/music:ro
    environment:
      - ND_SCANSCHEDULE=1h
      - ND_LOGLEVEL=info
      - ND_SESSIONTIMEOUT=24h
      - ND_BASEURL=
    restart: unless-stopped

  jellyfin:
    image: jellyfin/jellyfin:latest
    container_name: jellyfin
    ports:
      - "8096:8096"
      - "8920:8920"
    volumes:
      - ./services/jellyfin/config:/config
      - ./services/jellyfin/cache:/cache
      - ${MEDIA_PATH:-/mnt/storage/media}:/media:ro
    environment:
      - JELLYFIN_PublishedServerUrl=${JELLYFIN_URL:-http://localhost:8096}
    restart: unless-stopped

  mopidy:
    # LAN-hosted web music player (Spotify + YouTube + local library) with
    # Iris as the browser UI. Audio plays out the host's physical 3.5mm /
    # sound-card jack via ALSA — `/dev/snd` is passed through and the
    # container joins the host `audio` group.
    #
    # Gotcha: the host `audio` GID differs between distros (Debian 13 = 29,
    # Arch = 996). Set MOPIDY_AUDIO_GID in .env to your host's value:
    #   getent group audio | cut -d: -f3
    build:
      context: ./services/mopidy
    container_name: mopidy
    ports:
      - "6680:6680"
    volumes:
      - ./services/mopidy/config/mopidy.conf:/etc/mopidy/mopidy.conf:ro
      - ./services/mopidy/data:/var/lib/mopidy
      - ${MEDIA_PATH:-/mnt/storage/media}/music:/var/lib/mopidy/media:ro
    devices:
      - /dev/snd:/dev/snd
    group_add:
      - "${MOPIDY_AUDIO_GID:-29}"
    environment:
      # Spotify Premium is required for Mopidy-Spotify to play tracks.
      - SPOTIFY_USERNAME=${SPOTIFY_USERNAME:-}
      - SPOTIFY_PASSWORD=${SPOTIFY_PASSWORD:-}
      - SPOTIFY_CLIENT_ID=${SPOTIFY_CLIENT_ID:-}
      - SPOTIFY_CLIENT_SECRET=${SPOTIFY_CLIENT_SECRET:-}
    restart: unless-stopped

  caddy:
    # Reverse proxy fronting the home server on :80. Pairs with the
    # host's avahi-daemon (see install_avahi() in bootstrap.sh) so
    # `http://music.local` resolves on the LAN and routes to Mopidy/Iris.
    # Plain HTTP only — `.local` mDNS names can't get Let's Encrypt
    # certs, and we don't want to ship a custom CA to every client.
    image: caddy:2-alpine
    container_name: caddy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./services/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./services/caddy/welcome:/srv/welcome:ro
      - ./services/caddy/data:/data
      - ./services/caddy/config:/config
    depends_on:
      - mopidy
    restart: unless-stopped

  tailscale:
    image: tailscale/tailscale:latest
    container_name: tailscale
    hostname: homeserver
    volumes:
      - /dev/net/tun:/dev/net/tun
      - tailscale-state:/var/lib/tailscale
    environment:
      - TS_AUTHKEY=${TAILSCALE_AUTHKEY}
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_EXTRA_ARGS=--advertise-exit-node
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    restart: unless-stopped

volumes:
  tailscale-state:
