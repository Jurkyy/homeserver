version: "3.8"

services:
  openclaw:
    image: ghcr.io/openclaw/openclaw:latest
    container_name: openclaw
    ports:
      - "18789:18789"
    volumes:
      - ./services/openclaw/config:/config
      - ./services/openclaw/workspace:/workspace
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - DISCORD_BOT_TOKEN=${DISCORD_BOT_TOKEN}
      - DISCORD_CLIENT_ID=${DISCORD_CLIENT_ID}
      - HA_URL=${HA_URL:-http://homeassistant:8123}
      - HA_LONG_LIVED_TOKEN=${HA_LONG_LIVED_TOKEN}
    depends_on:
      - homeassistant
    restart: unless-stopped

  mosquitto:
    image: eclipse-mosquitto:2
    container_name: mosquitto
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./services/mosquitto/config:/mosquitto/config
      - ./services/mosquitto/data:/mosquitto/data
      - ./services/mosquitto/log:/mosquitto/log
    restart: unless-stopped

  homeassistant:
    image: ghcr.io/home-assistant/home-assistant:stable
    container_name: homeassistant
    ports:
      - "8123:8123"
    volumes:
      - ./services/homeassistant/config:/config
      - /etc/localtime:/etc/localtime:ro
    depends_on:
      - mosquitto
    privileged: true
    restart: unless-stopped

  navidrome:
    image: deluan/navidrome:latest
    container_name: navidrome
    ports:
      - "4533:4533"
    volumes:
      - ./services/navidrome/data:/data
      - ${MEDIA_PATH:-/mnt/storage/media}/music:/music:ro
    environment:
      - ND_SCANSCHEDULE=1h
      - ND_LOGLEVEL=info
      - ND_SESSIONTIMEOUT=24h
      - ND_BASEURL=
    restart: unless-stopped

  jellyfin:
    image: jellyfin/jellyfin:latest
    container_name: jellyfin
    ports:
      - "8096:8096"
      - "8920:8920"
    volumes:
      - ./services/jellyfin/config:/config
      - ./services/jellyfin/cache:/cache
      - ${MEDIA_PATH:-/mnt/storage/media}:/media:ro
    environment:
      - JELLYFIN_PublishedServerUrl=${JELLYFIN_URL:-http://localhost:8096}
    restart: unless-stopped

  librespot:
    # Spotify Connect target. The user controls playback from any
    # Spotify app on the LAN — the container shows up in the device
    # picker (named via LIBRESPOT_NAME) and streams audio out the
    # Focusrite Scarlett 2i2 over ALSA.
    #
    # network_mode: host is load-bearing: Spotify Connect device
    # discovery uses mDNS zeroconf, and multicast packets don't
    # traverse the default Docker bridge cleanly. Sharing the host
    # netns puts the announcements straight on the LAN.
    #
    # Gotcha: the host `audio` GID differs between distros (Debian 13
    # = 29, Arch = 996). Set LIBRESPOT_AUDIO_GID in .env to whatever
    #   getent group audio | cut -d: -f3
    # reports on the host — group_add injects that GID supplementarily
    # so the in-container process can open /dev/snd.
    build:
      context: ./services/librespot
    container_name: librespot
    network_mode: host
    devices:
      - /dev/snd:/dev/snd
    group_add:
      - "${LIBRESPOT_AUDIO_GID:-29}"
    command: >
      --name ${LIBRESPOT_NAME:-Homeserver}
      --backend alsa
      --device ${LIBRESPOT_ALSA_DEVICE:-plughw:CARD=USB,DEV=0}
      --bitrate 320
      --initial-volume 80
      --enable-volume-normalisation
    restart: unless-stopped

  caddy:
    # Reverse proxy fronting the home server on :80. Pairs with the
    # host's avahi-daemon (see install_avahi() in bootstrap.sh) so
    # mDNS names like `music.local` resolve on the LAN. Plain HTTP
    # only — `.local` names can't get Let's Encrypt certs, and we
    # don't want to ship a custom CA to every client.
    image: caddy:2-alpine
    container_name: caddy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./services/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./services/caddy/welcome:/srv/welcome:ro
      - ./services/caddy/data:/data
      - ./services/caddy/config:/config
    restart: unless-stopped

  tailscale:
    image: tailscale/tailscale:latest
    container_name: tailscale
    hostname: homeserver
    volumes:
      - /dev/net/tun:/dev/net/tun
      - tailscale-state:/var/lib/tailscale
    environment:
      - TS_AUTHKEY=${TAILSCALE_AUTHKEY}
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_EXTRA_ARGS=--advertise-exit-node
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    restart: unless-stopped

volumes:
  tailscale-state:
